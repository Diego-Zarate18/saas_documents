# Pruebas del backend. Se ejecutan desde backend/ con `uv run pytest ../tests` (arquitectura, sección 7).
# Vive aquí y no en backend/pyproject.toml porque pytest busca su configuración en la carpeta de las pruebas
# y hacia arriba, nunca en el directorio actual.
[pytest]
pythonpath = ../backend
# Sin este valor pytest-asyncio advierte, y filterwarnings = error lo volvería un fallo.
asyncio_default_fixture_loop_scope = function
markers =
    integracion: necesita las tres bases levantadas con docker compose y el .env local
addopts = --strict-markers
# Toda advertencia es un error, salvo la de Starlette que pide httpx2 en lugar de httpx: la tarea fija httpx
# (ver Dudas en el reporte de T-03).
filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated
