[project]
name = "sigedoc-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.165.0",
    "neo4j>=6.4.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymongo>=4.20.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.uv]
# Sin paquete instalable: la aplicación corre desde backend/ (app/) y las pruebas desde ../tests.
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
# Las pruebas viven en ../tests (guía, sección 10). Ruff solo descubre archivos bajo la carpeta que revisa, así que
# para incluirlas: `uv run ruff check . ../tests` y `uv run ruff format --check . ../tests` (usan esta configuración).

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # el español usa comillas «» y signos que ruff toma por ambiguos

[tool.ruff.lint.per-file-ignores]
"../tests/**" = ["S101"]  # assert es la forma de escribir pruebas con pytest

[tool.ruff.format]
quote-style = "single"

# La configuración de pytest está en ../tests/pytest.ini: con `pytest ../tests` solo se busca ahí y hacia arriba.
