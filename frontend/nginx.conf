# La interfaz y la API en el mismo origen: la cookie de sesión httpOnly (D-49) viaja sin CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # El DNS de Docker resuelve «api» en cada petición: si el contenedor api se recrea, su IP nueva se toma sola.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos con huella en el nombre no cambian: se guardan un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Aplicación de una sola página: toda ruta que no es un archivo carga index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
